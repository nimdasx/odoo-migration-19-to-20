services:
  odoo-migration-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo-migration-web
    restart: unless-stopped
    ports:
      - "8088:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - RUNNING_IN_DOCKER=1
