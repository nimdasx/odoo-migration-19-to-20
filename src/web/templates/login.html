<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Odoo Migration Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center bg-slate-950 px-4">
  <div class="max-w-md w-full space-y-8 bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
    
    <div class="text-center">
      <div class="mx-auto w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 text-white font-bold text-2xl mb-4">
        Ω
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">
        Odoo Migration Studio
      </h1>
      <p class="text-xs text-slate-400 mt-1.5">
        Silakan masukkan kredensial untuk mengakses studio migrasi.
      </p>
    </div>

    <!-- ALERT ERROR CONTAINER -->
    <div id="error-alert" class="hidden p-3 rounded-lg bg-rose-950/80 border border-rose-800 text-rose-300 text-xs flex items-center space-x-2">
      <svg class="w-4 h-4 text-rose-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
      <span id="error-message">Username atau password salah.</span>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form" class="mt-6 space-y-4" onsubmit="handleLogin(event)">
      <div>
        <label for="username" class="block text-xs font-medium text-slate-300 mb-1.5">Username</label>
        <input id="username" name="username" type="text" required autofocus
               class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
               placeholder="admin" value="admin">
      </div>

      <div>
        <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
        <input id="password" name="password" type="password" required
               class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
               placeholder="••••••••••••">
      </div>

      <div class="pt-2">
        <button type="submit" id="btn-submit"
                class="w-full flex justify-center py-2.5 px-4 border border-indigo-500/50 rounded-xl shadow-lg shadow-indigo-600/30 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition active:scale-[0.98]">
          Masuk ke Studio
        </button>
      </div>
    </form>

    <div class="text-center pt-2 text-[11px] text-slate-500">
      Kredensial dapat disesuaikan pada file <code class="text-slate-400">config.json</code>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      const alert = document.getElementById("error-alert");
      const errorMsg = document.getElementById("error-message");

      btn.disabled = true;
      btn.innerText = "Memverifikasi...";
      alert.classList.add("hidden");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = "/";
        } else {
          errorMsg.innerText = data.message || "Username atau password salah.";
          alert.classList.remove("hidden");
        }
      } catch (err) {
        errorMsg.innerText = "Gagal menghubungi server: " + err.message;
        alert.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerText = "Masuk ke Studio";
      }
    }
  </script>
</body>
</html>
